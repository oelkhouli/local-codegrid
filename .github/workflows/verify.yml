name: Verify Local CodeGrid
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CODEGRID_ENGINE: docker
      MAVEN_OPTS: -Xmx512m
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Unit and real PostgreSQL/Redis integration tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -Pintegration verify
      - name: TypeScript and production frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build and launch local platform
        run: ./codegrid up
      - name: Four-language, sandbox, worker-crash and duplicate-delivery tests
        run: python3 scripts/system_test.py --faults
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser workflow and mobile interface
        working-directory: frontend
        run: npm run test:e2e
      - name: Small load smoke sample (not p99 evidence)
        run: python3 scripts/benchmark.py --samples 32 --rate 0.5 --users 1 --output artifacts/ci-benchmark.json
      - name: Write verification summary (no paid artifact storage)
        if: always()
        run: python3 scripts/ci_summary.py
      - name: Stop test platform
        if: always()
        run: |
          if [ -f .env ]; then ./codegrid down; fi
